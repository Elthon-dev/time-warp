plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elthon.timewarp'
    compileSdk 34

    defaultConfig {
        applicationId "com.elthon.timewarp"
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(project.findProperty('twVersionCode') ?: '1')
        versionName "1.0"
    }

    def releaseKeystore = file(System.getProperty("user.home") + "/tw.keystore")

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword 'timewarp123'
                keyAlias 'timewarp'
                keyPassword 'timewarp123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystore.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
