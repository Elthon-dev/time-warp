name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing keystore
        # Runners are ephemeral; this keeps ONE signing key across all builds so
        # new APKs install as updates over older ones.
        uses: actions/cache@v4
        with:
          path: ~/tw.keystore
          key: timewarp-signing-keystore-v1

      - name: Create signing keystore if missing
        run: |
          if [ ! -f ~/tw.keystore ]; then
            keytool -genkeypair -v -keystore ~/tw.keystore -alias timewarp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass timewarp123 -keypass timewarp123 \
              -dname "CN=TimeWarp, OU=Dev, O=TimeWarp, L=Earth, ST=NA, C=US"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --warning-mode all -PtwVersionCode=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TimeWarp-v${{ github.run_number }}.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeWarp-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
