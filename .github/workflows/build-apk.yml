name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep a stable debug keystore
        # Runners are ephemeral, so without this every build gets a NEW
        # signature and updates stop installing over the previous APK.
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: timewarp-debug-keystore-v1

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --warning-mode all -PtwVersionCode=${{ github.run_number }}

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TimeWarp-v${{ github.run_number }}.apk
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeWarp-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
